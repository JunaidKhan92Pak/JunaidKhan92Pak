<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="438" viewBox="0 0 1000 438" role="img" aria-labelledby="title"><title id="title">THE ENGINEER</title><defs><linearGradient id="g"><stop stop-color="#0d202b"/><stop offset="1" stop-color="#080e14"/></linearGradient></defs><rect width="1000" height="438" rx="20" fill="url(#g)"/><g stroke="#66deff" stroke-opacity=".045" fill="none"><path d="M0 0V438"/><path d="M40 0V438"/><path d="M80 0V438"/><path d="M120 0V438"/><path d="M160 0V438"/><path d="M200 0V438"/><path d="M240 0V438"/><path d="M280 0V438"/><path d="M320 0V438"/><path d="M360 0V438"/><path d="M400 0V438"/><path d="M440 0V438"/><path d="M480 0V438"/><path d="M520 0V438"/><path d="M560 0V438"/><path d="M600 0V438"/><path d="M640 0V438"/><path d="M680 0V438"/><path d="M720 0V438"/><path d="M760 0V438"/><path d="M800 0V438"/><path d="M840 0V438"/><path d="M880 0V438"/><path d="M920 0V438"/><path d="M960 0V438"/><path d="M1000 0V438"/><path d="M0 0H1000"/><path d="M0 40H1000"/><path d="M0 80H1000"/><path d="M0 120H1000"/><path d="M0 160H1000"/><path d="M0 200H1000"/><path d="M0 240H1000"/><path d="M0 280H1000"/><path d="M0 320H1000"/><path d="M0 360H1000"/><path d="M0 400H1000"/></g><rect x=".5" y=".5" width="999" height="437" rx="20" stroke="#66deff" stroke-opacity=".22" fill="none"/><path d="M32 28h28M32 28v28M968 410h-28M968 410v-28" fill="none" stroke="#66deff" stroke-width="2"/><text x="52" y="58" font-family="monospace" font-size="14" font-weight="600" fill="#66deff">01 / THE ENGINEER</text><text x="52" y="112" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1fcff">From backend foundations</text><text x="52" y="155" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#66deff">to full-stack leadership.</text><text x="52" y="207" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#b4cbd2">I build applications where product engineering meets applied AI.</text><text x="52" y="240" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#b4cbd2">At WWAH.AI, I progressed from Backend Developer to Full-Stack</text><text x="52" y="273" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#b4cbd2">Engineer and Technical Team Lead. I also independently build Genrexa.</text><path d="M52 318h250" stroke="#244553"/><text x="52" y="368" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#66deff">03+</text><text x="52" y="397" font-family="monospace" font-size="12" font-weight="400" fill="#a2b8c2">YEARS OF EXPERIENCE</text><path d="M374 318h250" stroke="#244553"/><text x="374" y="368" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#66deff">04</text><text x="374" y="397" font-family="monospace" font-size="12" font-weight="400" fill="#a2b8c2">DEVELOPERS LED</text><path d="M696 318h250" stroke="#244553"/><text x="696" y="368" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#66deff">END TO END</text><text x="696" y="397" font-family="monospace" font-size="12" font-weight="400" fill="#a2b8c2">IDEA → DEPLOYMENT</text></svg>